<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected Video</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .player {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Privacy overlay shown whenever the page loses focus */
    #privacyOverlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #000;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    #privacyOverlay.active {
      display: flex;
    }

    .privacyMessage {
      max-width: 520px;
    }

    .lock {
      font-size: 52px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 10px;
    }

    p {
      margin: 0;
      color: #aaa;
      font-size: 15px;
      line-height: 1.5;
    }

    /* Small deterrent notice */
    #notice {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,0,0,.72);
      color: #fff;
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 12px;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }

    #notice.show { opacity: 1; }

    /* Prevent accidental selection/context menus */
    .player, video {
      -webkit-touch-callout: none;
    }
  </style>
</head>

<body>
  <div class="player" id="player">

    <!--
      REPLACE "YOUR-VIDEO.mp4" WITH YOUR VIDEO FILE OR VIDEO URL.
      Example:
      <video id="video" src="https://yourdomain.com/video.mp4"></video>
    -->
    <video
      id="video"
      controls
      playsinline
      preload="metadata"
      controlsList="nodownload noremoteplayback"
      disablePictureInPicture
    >
      <source src="https://lblamps.my.canva.site/wgs-video-storage/_assets/video/984c79acc8cd1a180c760f6e5c4df0a7.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <div id="privacyOverlay" aria-hidden="true">
      <div class="privacyMessage">
        <div class="lock">🔒</div>
        <h1>Content Paused for Privacy</h1>
        <p>Return to this page to continue viewing.</p>
      </div>
    </div>

    <div id="notice">Downloading and picture-in-picture are disabled.</div>
  </div>

  <script>
    const video = document.getElementById("video");
    const overlay = document.getElementById("privacyOverlay");
    const notice = document.getElementById("notice");

    let wasPlaying = false;

    function hideContent() {
      wasPlaying = !video.paused && !video.ended;

      // Pause immediately when the page loses focus.
      video.pause();

      overlay.classList.add("active");
      overlay.setAttribute("aria-hidden", "false");
    }

    function showContent() {
      overlay.classList.remove("active");
      overlay.setAttribute("aria-hidden", "true");

      // Resume only if it was playing before focus was lost.
      if (wasPlaying) {
        video.play().catch(() => {});
      }
    }

    // Covers the video when the browser tab/window is no longer visible.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        hideContent();
      } else {
        showContent();
      }
    });

    // Also covers it when the browser window loses focus.
    window.addEventListener("blur", hideContent);
    window.addEventListener("focus", showContent);

    // Disable right-click/context menu.
    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      notice.textContent = "Right-click is disabled on this page.";
      notice.classList.add("show");
      setTimeout(() => notice.classList.remove("show"), 1800);
    });

    // Disable common save/copy shortcuts.
    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (
        (event.ctrlKey || event.metaKey) &&
        ["s", "u", "c", "p"].includes(key)
      ) {
        event.preventDefault();
        notice.textContent = "This action is disabled.";
        notice.classList.add("show");
        setTimeout(() => notice.classList.remove("show"), 1800);
      }

      // F12 / common developer-tool shortcuts
      if (
        event.key === "F12" ||
        (event.ctrlKey && event.shiftKey && ["i", "j", "c"].includes(key))
      ) {
        event.preventDefault();
      }
    });

    // Prevent dragging the video element.
    video.addEventListener("dragstart", (event) => event.preventDefault());

    // Disable picture-in-picture where supported.
    video.addEventListener("enterpictureinpicture", () => {
      try {
        document.exitPictureInPicture();
      } catch (_) {}
    });

    // Start with a clean state.
    overlay.classList.remove("active");
  </script>
</body>
</html>
